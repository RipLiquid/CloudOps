name: CloudOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw test

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy Backend to AWS
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build Lambda package
        run: ./mvnw clean package -DskipTests

      - name: Locate Lambda JAR
        id: lambda
        shell: bash
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f \
            -name 'cloudops-*.jar' \
            ! -name 'original-*' \
            | head -n 1)

          if [ -z "$JAR_PATH" ]; then
            echo "Lambda JAR not found."
            exit 1
          fi

          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Deploying $JAR_PATH"

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: CloudOpsGitHubActions

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name CloudOpsApi \
            --zip-file fileb://${{ steps.lambda.outputs.path }} \
            --region ca-central-1

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name CloudOpsApi \
            --region ca-central-1

      - name: Verify Lambda deployment
        run: |
          aws lambda get-function-configuration \
            --function-name CloudOpsApi \
            --region ca-central-1 \
            --query '{FunctionName:FunctionName,Runtime:Runtime,LastModified:LastModified,LastUpdateStatus:LastUpdateStatus}'