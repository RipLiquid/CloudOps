name: CloudOps Container

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/container.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pom.xml'
      - 'src/**'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Build, test and publish container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ripliquid/cloudops
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image and run backend tests
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=CloudOps Spring Boot backend; requires AWS and Cognito configuration for incident operations" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag cloudops:check .

      - name: Check container startup and authentication
        run: |
          docker run --detach --name cloudops-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env AWS_EC2_METADATA_DISABLED=true \
            cloudops:check
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health > health.json; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json; assert json.load(open("health.json"))["status"] == "UP"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/incidents)
          test "$status" = '401'

      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect cloudops-smoke > /dev/null 2>&1; then
            docker logs cloudops-smoke
            docker rm --force cloudops-smoke
          fi

      - name: Publish tested image to GitHub Packages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag cloudops:check "$IMAGE:sha-$GITHUB_SHA"
          docker tag cloudops:check "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          {
            echo '### CloudOps backend image'
            echo "Published: \`$IMAGE:latest\`"
            echo "Pinned to this commit: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo 'Platform: linux/amd64. Startup and unauthenticated API checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"
